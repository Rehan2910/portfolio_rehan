<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" fill="#11181C"/>
  <g stroke="#2A3438" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/><line x1="280" y1="0" x2="280" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="0" y1="40" x2="400" y2="40"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>
  <!-- pose skeleton -->
