  <!-- bounding box -->
  <rect x="130" y="35" width="140" height="175" fill="none" stroke="#F6F7F4" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="134" y="28" fill="#F6F7F4" font-family="monospace" font-size="12" opacity="0.8">PERSON 0.97</text>
