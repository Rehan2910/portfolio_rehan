  <circle cx="200" cy="55" r="14" fill="none" stroke="#D9A441" stroke-width="2.5"/>
  <g fill="#0E7C7B">
    <circle cx="200" cy="70" r="4"/><circle cx="200" cy="130" r="4"/>
    <circle cx="160" cy="110" r="4"/><circle cx="240" cy="110" r="4"/>
    <circle cx="170" cy="185" r="4"/><circle cx="230" cy="185" r="4"/>
